# Quarkus Application Configuration
quarkus.application.name=camel-jms-app

# Paho MQTT5 Configuration for MQTTS with mTLS
camel.component.paho-mqtt5.broker-url=ssl://${BROKER_HOST}:${BROKER_PORT}
camel.component.paho-mqtt5.client-id=camel-mqtt-client-${APP_ROLE}

# Pass the PEM paths into Paho's SSL Client Properties using bracket notation for dotted keys
camel.component.paho-mqtt5.ssl-client-props[com.ibm.ssl.trustStore]=/app/tls/ca/ca.pem
camel.component.paho-mqtt5.ssl-client-props[com.ibm.ssl.trustStoreType]=PEMCA
camel.component.paho-mqtt5.ssl-client-props[com.ibm.ssl.keyStore]=/app/tls/pem/tls.pemcfg
camel.component.paho-mqtt5.ssl-client-props[com.ibm.ssl.keyStoreType]=PEMCFG

# Topic Configuration (PRODUCER_QUEUE and CONSUMER_QUEUE must be set via environment variables)
producer.queue=${PRODUCER_QUEUE}
consumer.queue=${CONSUMER_QUEUE}

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.arkmq".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO

# Camel Configuration
camel.context.name=camel-jms-app-context

# Health and Metrics
quarkus.health.extensions.enabled=true
quarkus.micrometer.enabled=true
