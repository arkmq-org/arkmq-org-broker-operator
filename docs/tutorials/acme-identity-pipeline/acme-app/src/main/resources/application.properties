quarkus.application.name=acme-app
# BROKER_HOST and BROKER_PORT come from the BrokerApp's binding secret, read by entrypoint.sh
quarkus.qpid-jms.url=amqps://${BROKER_HOST}:${BROKER_PORT}?transport.trustStoreType=PEMCA&transport.trustStoreLocation=/app/tls/ca/ca.pem&transport.keyStoreType=PEMCFG&transport.keyStoreLocation=/app/tls/pem/tls.pemcfg
quarkus.qpid-jms.username=${APP_NAME}

quarkus.qpid-jms.wrap=true
quarkus.pooled-jms.max-connections=4
camel.component.jms.cache-level-name=CACHE_CONSUMER

acme.role=${APP_ROLE:sink}
acme.name=${APP_NAME:acme-app}
acme.in=${IN_DEST:}
acme.out=${OUT_DEST:}
acme.rate=${RATE:2}
acme.delay.ms=${DELAY_MS:0}

camel.context.name=acme
quarkus.log.level=INFO
quarkus.log.category."org.apache.camel".level=INFO
quarkus.banner.enabled=false
