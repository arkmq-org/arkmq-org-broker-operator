quarkus.application.name=camel-jms-app
quarkus.qpid-jms.url=amqps://${BROKER_HOST}:${BROKER_PORT}?transport.trustStoreType=PEMCA&transport.trustStoreLocation=/app/tls/ca/ca.pem&transport.keyStoreType=PEMCFG&transport.keyStoreLocation=/app/tls/pem/tls.pemcfg
quarkus.qpid-jms.username=${CLIENT_USERNAME}

# JMS CONNECTION POOLING
quarkus.qpid-jms.wrap=true
quarkus.pooled-jms.max-connections=10

# Cache JMS consumers and sessions to avoid connection-per-message churn
camel.component.jms.cache-level-name=CACHE_CONSUMER

# ============================================================
# PIPELINE ROLE
# Selects which Camel route this deployment activates.
#
# Valid values (set via APP_ROLE env variable):
#   generator  — produces orders into ORDERS.NEW
#   processor  — ORDERS.NEW        → ORDERS.PROCESSED
#   shipping   — ORDERS.PROCESSED  → ORDERS.SHIPPED
#   delivery   — ORDERS.SHIPPED    → ORDERS.DELIVERED
#   sink       — drains one or more queues (testing / drain)
# ============================================================

app.role=${APP_ROLE:sink}

# Queue this deployment consumes from (not used by generator)
consumer.queue=${CONSUMER_QUEUE:ORDERS.NEW}

# Queue this deployment produces into (falls back to role default when absent)
producer.queue=${PRODUCER_QUEUE:}

# ============================================================
# GENERATOR SETTINGS  (APP_ROLE=generator)
# ============================================================

# Target messages per second; controls the timer period (1000 / MESSAGE_RATE ms)
message.rate=${MESSAGE_RATE:25}
# ============================================================
# PROCESSOR / SHIPPING / DELIVERY SETTINGS
# ============================================================

# Artificial processing latency in milliseconds (0 = no delay)
processing.delay.ms=${PROCESSING_DELAY_MS:0}

# Fraction of messages that fail with a RuntimeException (0.0 = never fail)
# Failed messages are redelivered then sent to the dead-letter queue.
error.rate=${ERROR_RATE:0.0}

# Number of concurrent JMS consumers on the input queue
consumer.concurrency=${CONSUMER_CONCURRENCY:1}

camel.context.name=camel-jms-pipeline-context
quarkus.log.level=INFO
quarkus.log.category."com.arkmq".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO
# quarkus.health.extensions.enabled=true  (add quarkus-smallrye-health to pom.xml to enable)
# quarkus.micrometer.enabled=true          (add quarkus-micrometer to pom.xml to enable)